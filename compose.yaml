services:
  oui-wechat:
    build: .
    image: oui-wechat:local
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "${OUI_BIND_ADDRESS:-0.0.0.0}:${OUI_PORT:-8787}:8787"
    volumes:
      - oui-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  oui-data:
