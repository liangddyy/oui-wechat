[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oui-wechat"
version = "0.1.0"
description = "Open WebUI 微信接入与 Web 管理"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = [
    "open-webui-weixin==0.1.0",
    "aiohttp>=3.11",
    "cryptography>=46",
    "Pillow>=12",
    "markdown-it-py>=4",
]

[project.scripts]
oui-wechat = "oui_wechat.__main__:main"

[dependency-groups]
dev = ["ruff==0.17.2"]

[tool.uv.sources]
open-webui-weixin = { path = "vendor/open-webui-weixin", editable = true }

[tool.setuptools.packages.find]
include = ["oui_wechat*"]

[tool.setuptools.package-data]
oui_wechat = ["static/*", "static/icons/*"]
