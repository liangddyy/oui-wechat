name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.8.4
      - run: uv sync --frozen
      - run: uv run python scripts/validate.py --label ci
      - run: uv run ruff check oui_wechat tests scripts validation
